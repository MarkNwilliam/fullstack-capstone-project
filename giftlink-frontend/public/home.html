<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftLink | Give away what you no longer need</title>
    <meta name="description" content="GiftLink connects people who want to give away household items they no longer need with people who prefer to recycle or find free items.">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/home.css">
</head>
<body>
    <div class="container my-5">
        <div class="text-center">
            <!-- Task 1: Add the main heading -->
            <h1 class="giftlink-title">GiftLink</h1>

            <!-- Task 2: Add the subheading -->
            <h2 class="giftlink-subtitle">Give away what you no longer need, find what you need for free</h2>

            <!-- Task 3: Add the inspirational quote -->
            <p class="lead giftlink-quote">
                "One person's trash is another person's treasure. Pass it on instead of throwing it away."
            </p>

            <!-- Task 4: Add the 'Get Started' button -->
            <a href="/" class="btn btn-primary btn-lg get-started">Get Started</a>
        </div>
    </div>
</body>
</html>
