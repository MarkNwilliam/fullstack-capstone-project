name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    name: Lint and syntax check the backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: giftlink-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: giftlink-backend
        run: npm ci

      - name: Syntax check the backend JavaScript
        working-directory: giftlink-backend
        run: |
          for file in app.js models/db.js routes/giftRoutes.js routes/searchRoutes.js routes/authRoutes.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Lint the sentiment service
        working-directory: sentiment
        run: |
          npm install --no-save
          node --check index.js
          node --check logger.js

  lint-frontend:
    name: Build the React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: giftlink-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: giftlink-frontend
        run: npm ci

      - name: Build the production bundle
        working-directory: giftlink-frontend
        env:
          CI: true
        run: npm run build

      - name: Upload the production build as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: giftlink-frontend-build
          path: giftlink-frontend/build
          retention-days: 7

  docker-build:
    name: Build the Docker images
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: giftlink-backend
          push: false
          tags: giftlink-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: giftlink-frontend
          push: false
          tags: giftlink-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max